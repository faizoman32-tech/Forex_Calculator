<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Professional Forex Position Size & Risk Calculator. Calculate exact lot sizes, risk-to-reward ratios, and manage your trading risk for EUR/USD and other major pairs." />
    <meta name="keywords" content="forex, position size, risk calculator, lot size, EUR/USD, trading, risk management" />
    <meta name="author" content="Forex Calculator" />
    <meta name="theme-color" content="#030712" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Forex Position Size & Risk Calculator" />
    <meta property="og:description" content="Calculate exact lot sizes, risk-to-reward ratios, and manage your trading risk for EUR/USD and other major currency pairs." />
    <meta property="og:site_name" content="Forex Calculator" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Forex Position Size & Risk Calculator" />
    <meta name="twitter:description" content="Calculate exact lot sizes, risk-to-reward ratios, and manage your trading risk." />

    <title>Forex Position Size & Risk Calculator</title>

    <!-- Preload critical font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Inline critical styles to prevent FOUC -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #030712;
        color: #f3f4f6;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #root {
        min-height: 100vh;
      }
      /* Loading state */
      .app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        flex-direction: column;
        gap: 1rem;
      }
      .app-loading .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading">
        <div class="spinner"></div>
        <span style="color: #9ca3af; font-size: 14px;">Loading Calculator...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
